[package]
name = "banshee"
version = "0.2.2"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-or-later"
description = "Queue-first GNOME player for YouTube Music, YouTube videos, podcasts and Spotify"
repository = "https://github.com/castrojo/projectbanshee"
publish = false

[lib]
name = "banshee"
path = "src/lib.rs"

[[bin]]
name = "banshee"
path = "src/main.rs"

[dependencies]
gtk = { package = "gtk4", version = "0.11", features = ["v4_20"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_8"] }
gst = { package = "gstreamer", version = "0.25" }
gst-app = { package = "gstreamer-app", version = "0.25" }
gst-audio = { package = "gstreamer-audio", version = "0.25" }
tokio = { version = "1.47", features = ["rt-multi-thread", "sync", "time", "process", "macros", "fs", "io-util", "signal", "net"] }
async-channel = "2.5"
futures = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["json", "gzip", "http2", "charset", "default-tls", "query"] }
ytmapi-rs = { version = "0.3.3", default-features = false, features = ["default-tls", "simplified-queries"] }
librespot-core = { version = "0.8", default-features = false, features = ["native-tls"] }
librespot-playback = { version = "0.8", default-features = false, features = ["native-tls"] }
librespot-oauth = { version = "0.8", default-features = false }
librespot-metadata = { version = "0.8", default-features = false, features = ["native-tls"] }
nucleo-matcher = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"
env_logger = "0.11"
url = "2"
sha2 = "0.10"
hex = "0.4"
libc = "0.2"
rand = "0.9"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 4
