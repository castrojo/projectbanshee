app-id: org.projectbluefin.Banshee
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: banshee
finish-args:
  - --share=network
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=pulseaudio
  - --device=dri
  - --own-name=org.mpris.MediaPlayer2.banshee
  - --filesystem=xdg-run/dconf
  # Access flatpak browser profiles for session cookie import
  - --filesystem=~/.var/app/org.mozilla.firefox:ro
  - --filesystem=~/.var/app/com.brave.Browser:ro
  - --filesystem=~/.var/app/com.google.Chrome:ro
modules:
  - name: python3-yt-dlp
    buildsystem: simple
    build-commands:
      - pip3 install --no-index --find-links=file://$(pwd) --prefix=/app yt_dlp
    sources:
      - type: file
        url: https://files.pythonhosted.org/packages/69/b2/8cd1613f56eed7ceb64fbd4df3f1c01246bfb098e6f398228bafda22b80b/yt_dlp-2026.8.19-py3-none-any.whl
        sha256: 1d57897e94c6665a0a6f9bc54b34e584284e32c034ffab3a7df25d8f7b24eedf

  - name: banshee
    buildsystem: meson
    sources:
      - type: dir
        path: .
